<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6f78" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Static fallbacks for crawlers that do not run JavaScript. SeoHead
         keeps these in sync with the language the visitor selects. -->
    <title>ديرما كير بيوتي كلينك — عيادة تجميل ومنتجات عناية بالبشرة</title>
    <meta
      name="description"
      content="ديرما كير بيوتي كلينك — عيادة تجميل ومنتجات عناية بالبشرة في السودان. تحضيرات نعدّها في العيادة مع نصيحة واضحة ومتابعة بعد الشراء."
    />
    <meta name="robots" content="index, follow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />

    <!-- The hero image is the LCP element on every viewport. -->
    <link rel="preload" as="image" href="/images/hero-banner.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
